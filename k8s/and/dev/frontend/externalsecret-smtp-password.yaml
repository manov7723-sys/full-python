apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: full-python-frontend-smtp-password
  namespace: and
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: deepagent-aws
    kind: ClusterSecretStore
  target:
    name: app-env
    creationPolicy: Merge
  data:
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: teams-dev/and/SMTP_PASSWORD
